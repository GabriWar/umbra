[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "umbra-browser"
version = "0.1.0"
description = "Maximum-stealth browser automation. Real Chrome + ARIA-first driver + per-session fingerprint payload + tracker blocking."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Gabriel"}]
keywords = ["browser", "automation", "stealth", "anti-bot", "scraping", "mcp", "cdp", "fingerprint"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
    "nodriver>=0.47.0",
    "fastmcp>=2.0",
    "cryptography>=42", # encrypted session save/load (umbra.session)
    "websockets>=13", # handoff remote-view server (also transitive via nodriver)
    "curl-cffi>=0.15.0",
    "lxml>=5", # web_search engine HTML parsing (umbra.search)
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
playwright = [
    "playwright>=1.48",
]
sessions = [
    "cryptography>=42",
]
markdown = [
    "markdownify>=0.13",
    "readability-lxml>=0.8",
]
all = [
    "playwright>=1.48",
    "cryptography>=42",
    "markdownify>=0.13",
    "readability-lxml>=0.8",
]

[project.scripts]
umbra-server = "umbra.server:main"
umbra-cloak-setup = "umbra.cloak.__main__:main"

[project.urls]
Homepage = "https://github.com/gabriel/umbra"

[tool.hatch.build.targets.wheel]
packages = ["src/umbra"]

[tool.hatch.build.targets.wheel.force-include]
"src/umbra/stealth/payload.js" = "umbra/stealth/payload.js"
"src/umbra/stealth/tracker_domains.txt" = "umbra/stealth/tracker_domains.txt"

[tool.pytest.ini_options]
markers = ["e2e: end-to-end tests that launch real Chrome and hit the network"]
asyncio_mode = "auto"
